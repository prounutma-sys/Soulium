plugins {
    id 'java'
}

version = '1.0.0'
group = 'com.soulther.mod'
base {
    archivesName = 'Soulther'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
}

dependencies {
    compileOnly 'net.minecraftforge:forge:1.20.1-47.2.0:userdev'
}
