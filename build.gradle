name: Build Soulther JAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build JAR File Directly
      run: |
        mkdir -p build/libs
        mkdir -p bin
        find src -name "*.java" > sources.txt || true
        if [ -s sources.txt ]; then
          javac -d bin @sources.txt
          jar cvmf src/main/resources/META-INF/MANIFEST.MF build/libs/Soulther.jar -C bin .
        else
          echo "Manifest olmadan paketleniyor..."
          jar cvf build/libs/Soulther.jar .
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Soulther-JAR
        path: build/libs/*.jar
