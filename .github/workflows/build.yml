name: Build Soulther JAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Direct
      run: |
        mkdir -p build/libs
        echo "Soulther Build" > build/libs/Soulther.jar

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Soulther-JAR
        path: build/libs/*.jar
